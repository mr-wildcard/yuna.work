projectsSection:
  title: Sélection de projets
  text: Mes collaborations sont majoritairement placées sous clause de
    confidentialité.
projects:
  - title: Repenser l’architecture UX de l’outil Snale Floods pour aider les
      collectivités à prendre des décisions concernant les inondations
    cover: ../media/images/projects/snale-floods.jpg
    tags:
      - Refonte UX
      - Données complexes
      - Outil métier
    testimonials:
      - quote: <p>Nous avons fait appel à Yuna pour la conception de notre
          application web à destination des collectivités sur la prévision des
          inondations. Le projet était particulier et complexe car il mélange des
          connaissances métier sur les inondations avec un outil d’aide à la
          décision simple, intuitif et surtout inclusif. Yuna a été très à l’aise
          avec cette complexité et a su proposer différentes pistes d’UX afin de
          répondre aux besoins des utilisateurs. Les maquettes livrées sont de
          très haute qualité avec des annotations qui ont permis à notre équipe
          de développement d’être efficace dans le développement.</p>
        author: Fabien Rétif, fondateur et directeur technique de Snale
        lang: fr
  - title: Accompagner les équipes du magazine ELLE dans leur transformation
      produit et co-construire la future expérience en ligne
    cover: ../media/images/projects/elle.jpg
    tags:
      - Transformation produit
      - <span lang='en'>Business model</span>
      - Site éditorial
    testimonials:
      - quote:
          <p>Collaborer avec Yuna a été un réel plaisir, et sa mission s’est
          avérée très efficace. Elle sait avec beaucoup de vitalité, de
          clairvoyance et de calme écouter et saisir des enjeux produit, business
          ou organisationnels complexes. Elle revient avec des solutions
          concrètes et activables, alliant une vision globale autant que le souci
          du détail. Elle a, entre autre, particulièrement excellé à animer des
          ateliers aux parties prenantes nombreuses et diverses.</p>
        author: Sophie Rollin, directrice produit & projets numériques chez CMI
          Media
        lang: fr
  - title: Faire monter en compétences les <span lang='en'>designers</span> de
      dynamo avec des revues de design orientées accessibilité et éco-conception
    cover: ../media/images/projects/dynamo.jpg
    tags:
      - <span lang='en'>Design review</span>
      - Mentorat
      - Accessibilité et éco-conception
    testimonials:
      - quote: <p>Nous avons fait appel à Yuna pour évaluer des parcours
          utilisateurs sous l’angle de l’accessibilité et nous guider sur la mise
          en oeuvre des bonnes pratiques. Cette collaboration s’est révélée être
          une expérience extrêmement enrichissante pour nos designers. Yuna a
          démontré une expertise de premier ordre, qu’elle a partagée avec notre
          équipe avec beaucoup de pertinence et de générosité.</p>
        author: Philippe Cossé, directeur associé chez dynamo
        lang: fr
      - quote:
          <p>J’ai eu le plaisir de collaborer avec Yuna sur la création d’un
          site web pour lequel l’accessibilité était un enjeu essentiel. Nous
          avons itéré ensemble pendant toute la phase de conception UX pour
          s’assurer que les normes d’accessibilité étaient respectées et
          implémentées. C’était une expérience particulièrement intéressante qui
          m’a permis d’aborder mon travail avec un nouveau regard. J’ai beaucoup
          apprécié travailler avec Yuna dont les contributions et le
          professionnalisme ont été des atouts précieux.</p>
        author: Inès Chopin, <span lang='en'>UX designer</span> senior chez dynamo
        lang: fr
      - quote: <p>Yuna fait partie de ces perles rares dans le milieu
          professionnel, à la fois passionnée et experte dans son domaine mais
          aussi très curieuse d’autres disciplines, avec une attitude pédagogue
          et toujours très humble. J’ai eu l’opportunité de faire appel à ses
          services durant la conception UI d’une application B2B impliquant
          diverses formes de visualisation de données. Yuna m’a fourni une
          analyse fine et très concrète des maquettes que je lui ai soumises.
          Notre échange m’a permis d’améliorer mon design jusqu’au moindre détail
          afin de le mettre en conformité avec les normes d’accessibilité.</p>
        author: Nikita Vidal, <span lang='en'>UX/UI designer</span> senior chez
          dynamo
        lang: fr
  - title: Refondre la solution Logus pour faciliter le suivi des dossiers
      usagères et usagers au sein des établissements médico-sociaux
    cover: ../media/images/projects/sys1.jpg
    tags:
      - Refonte UX
      - Données de santé
      - Outil métier
    testimonials:
      - quote: <p>Avec une grande capacité de compréhension de l’ensemble des
          process spécifiques à notre secteur d’activité, Team UX a parfaitement
          su répondre aux besoins de nos différents métiers. Merci à Daniela et à
          Yuna pour leur dynamisme, leur réactivité et leur
          professionnalisme.</p>
        author: Dominique Barillot, ingénieur commercial chez Sys1
        lang: fr
      - quote: <p>Team UX a su prendre en charge l’ergonomie et le graphisme de
          LOGUS avec la plus grande efficacité et professionnalisme. Nous avons
          énormément apprécié la collaboration et notamment la réactivité, la
          disponibilité dont Team UX a fait preuve et surtout les idées qu’elles
          ont présentées. L’équipe a pris en compte nos contraintes temporelles,
          techniques et organisationnelles afin de répondre au mieux à notre
          besoin. Notre logiciel se modernise, les interfaces sont plus belles,
          l’ergonomie est plus travaillée et ce tout en gardant son identité et
          son ADN propre. Des échanges très riches. C’est un réel plaisir de
          pouvoir collaborer et travailler ensemble dans un cadre agréable et
          organisé.</p>
        author: Julien Narboni, chef de projets technico-fonctionnel chez Sys1
        lang: fr
  - title: Accompagner l’équipe design d’Infopro Digital dans la mise en
      conformité RGAA de leurs productions design
    cover: ../media/images/projects/infopro.jpg
    tags:
      - Design accessible
      - <span lang='en'>Design review</span>
    testimonials:
      - quote:
          <p>J’ai découvert Yuna &amp; Daniela grâce au réseau Opquast, dont
          nous sommes toutes trois certifiées. Elles ont démontré efficacité et
          pertinence en accompagnant mon équipe dans leur montée en compétence en
          accessibilité numérique. Grâce à leur expertise et leurs conseils
          avisés, nous avons pu mener rapidement à bien la mise en conformité
          RGAA d’interfaces clés pour nos produits B2B. Leur contribution a été
          très appréciée par l’équipe, avec qui elles ont collaboré de manière
          très fluide.</p>
        author: Aurore Bourdier, Head of Design chez Infopro Digital
        lang: fr
  - title: Refondre le système d’information d’un <span lang='en'>leader</span>
      du transport pour faciliter les échanges internes et externes
    cover: ../media/images/projects/ekino.jpg
    tags:
      - Transformation numérique
      - Système d’information
      - Outils métier
    testimonials:
      - quote:
          <p>Tout simplement ravis de la collaboration avec Yuna et Daniela.
          La qualité de leur travail, de l’accompagnement de clients novices en
          la matière, des livrables et des analyses constructives et leur
          dynamisme ont été un vrai plus pour ce projet.</p>
        author: Alexandre Pronine, <span lang='en'>manager</span> technique chez
          Ekino
        lang: fr
      - quote: <p>Comment arriver à travailler tous ensemble autour d’un si gros
          projet ? Daniela et Yuna, par leur expérience, leur bienveillance, leur
          écoute et leur méthodologie, ont complètement réussi leur challenge.
          Nous avons été impressionnés par la complicité qui est née entre nos
          collaborateurs et par les idées qui sont ressorties.</p>
        author: La cliente, co-gérante d’une société de transport
        lang: fr
      - quote:
          <p>Merci à vous les filles pour ce superbe travail, c’était une joie
          de faire ce projet avec vous. Vous avez toujours été d’une rigueur et
          d’une motivation sans faille.</p>
        author: Camille Fion, consultante technique senior chez Ekino
        lang: fr
  - title: Concevoir le nouveau site Web et le discours de la School of System
      Change pour en recruter les futures promotions
    cover: ../media/images/projects/school-system-of-change.jpg
    tags:
      - Stratégie UX
      - Changement systémique
      - Site Web
    testimonials:
      - quote: <p>Yuna and Daniela supported us with a brilliant UX strategy and
          wireframes for our new low-carbon website, which has made a huge
          difference to our organisation. Overall our website is performing very
          well and as we grow our impact and reach we’ll continue to work with
          them.</p>
        author: Saskia Rysenbry, curator at School of System Change
        lang: en
  - title: Développer l’empathie des équipes avec un outil de cartographie des
      parcours des usagères et usagers de l’agglomération
    cover: ../media/images/projects/cap-atlantique.jpg
    tags:
      - <span lang='en'>Design thinking</span>
      - Relation usagères et usagers
      - Cartographie
    testimonials:
      - quote:
          <p>Yuna et Daniela sont très à l’écoute et fiables. Nous avons été
          impressionnées par leur expertise design et leur efficacité. Elles ont
          également une belle capacité à questionner le besoin et à le
          reformuler. Nous avons pu croiser nos expertises de <span
          lang='en'>coaching</span> et design au bénéfice de notre client, une
          collectivité de Loire Atlantique. Une collaboration d’une excellente
          qualité avec une vision à 360.</p>
        author:
          Nathalie Dehouck et Marie Fréour, <span lang='en'>coachs</span> et
          consultantes chez Sous le sens et Satori&co
        lang: fr
  - title: Repenser la stratégie UX du <span lang='en'>leader</span> de
      l’évaluation DXOMARK pour parler à un public aussi bien technophile que
      novice
    cover: ../media/images/projects/dxomark.jpg
    tags:
      - Stratégie UX
      - Données complexes
      - Site éditorial
    testimonials:
      - quote: <p>Chaque livrable démontre la capacité de Team UX à faire des
          propositions mûrement réfléchies, sur tous les aspects, toujours
          pertinentes et cohérentes.</p>
        author: Etienne Knauer, <span lang='en'>SVP sales & marketing</span> de
          DXOMARK
        lang: fr
  - title: Refondre le site et les espaces connectés du bailleur social Groupe
      Des Chalets pour le rapprocher de ses cibles multiples
    cover: ../media/images/projects/groupe-des-chalets.jpg
    tags:
      - Refonte UX
      - Habitat social
      - Espace connecté
    testimonials:
      - quote: <p>Nous avons fait appel à Team UX pour plusieurs sites web et
          l’espace authentifié de l’un de nos clients (habitat social). Yuna et
          Daniela se sont très vite acculturées au sujet et ont produit des
          prototypes intégrant les bonnes pratiques de qualité (Opquast) et les
          règles d’accessibilité (RGAA) relatives au design. Elles ont fait
          preuve d’une grande rigueur et d’une capacité d’écoute.</p>
        author: Jade Vincent, co-fondatrice de Rose Primaire
        lang: fr
  - title: Concevoir la nouvelle appli de domotique MeyerDom pour les personnes
      handicapées et les institutions médicalisées
    cover: ../media/images/projects/meyer-dom.jpg
    tags:
      - Conception UX
      - Design accessible
      - Application mobile
    testimonials:
      - quote: <p>Vous pouvez être certaines qu’avec un rendu pareil, je ne
          manquerai pas de refaire appel à vous.</p>
        author: Julie Lapouge, chef de projet chez Mink
        lang: fr
