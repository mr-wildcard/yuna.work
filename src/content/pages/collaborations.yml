intro:
  title: Collaborations
  text: J’accompagne des équipes de toutes tailles, provenant de nombreux
    secteurs et sur des périmètres riches et variés.
missions:
  title: Exemples de missions
  items:
    - Audit, refonte ou création d’outils, de sites, d’applications métiers
    - <span lang='en'>Consulting</span> en design UX, accessibilité et standards
      de qualité Web
    - Accompagnement d’équipes dirigeantes, <span lang='en'>design ops</span> et
      <span lang='en'>design fiction</span>
    - Recherche UX et développement de la connaissance “<span
      lang='en'>users</span>”
    - Animation de processus de <span lang='en'>design thinking</span>, de <span
      lang='en'>design sprints</span>
    - Conception UX et test de PoCs, de prototypes
    - <span lang='en'>Design review</span>, mentorat et structuration des
      processus design
