media:
  - name: project-images
    label: Images projets
    input: src/content/media/images/projects
    output: ../media/images/projects

content:
  - name: projects
    label: Projets
    type: collection
    path: src/content/projects
    filename: "{slug}.md"
    view:
      fields: [order, title]
      sort: [order, title]
      default:
        sort: order
        order: desc
    fields:
      - { name: order, label: Ordre, type: number }
      - { name: title, label: Titre, type: string }
      - name: cover
        label: Image
        type: image
        options:
          media: project-images
          path: src/content/media/images/projects
      - name: tags
        label: Tags
        type: string
        list: true
      - { name: isOngoing, label: "Mission en cours", type: boolean }
      - name: testimonials
        label: Témoignages
        type: object
        list: true
        fields:
          - {
              name: quote,
              label: Citation,
              type: rich-text,
              options: { format: html },
            }
          - { name: author, label: Auteur, type: string }
          - { name: lang, label: "Langue (en/fr)", type: string }
